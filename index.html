<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe5d2">
<meta name="description" content="A calm, local-first A-Level study planner, timetable, timer and academic journal.">
<link rel="manifest" href="manifest.json">
<title>Academic Ledger</title>
<style>
:root{
  --bg:#efe5d2;--surface:#f8f1e4;--surface2:#e8dcc7;--ink:#2f241e;--muted:#76695d;
  --accent:#355b47;--accent2:#7f2632;--gold:#a17d42;--line:#cfc0a8;--shadow:0 10px 30px rgba(53,39,25,.08);
  --radius:14px;--danger:#874b46;--ok:#3d654e;--focus:#9a6d22;
}
[data-theme="christmas"]{--bg:#eee7dc;--surface:#faf7f0;--surface2:#e1ddd0;--ink:#29352e;--muted:#687067;--accent:#315b45;--accent2:#7b2934;--gold:#a18345;--line:#c8c3b7}
[data-theme="minimal"]{--bg:#f4f4f1;--surface:#fff;--surface2:#ecece7;--ink:#272722;--muted:#6c6c64;--accent:#444c43;--accent2:#62524d;--gold:#75694d;--line:#d4d4cc}
[data-theme="pink"]{--bg:#f5e9e8;--surface:#fff8f7;--surface2:#ead6d6;--ink:#392b2e;--muted:#776568;--accent:#72505b;--accent2:#8b3f4f;--gold:#9a7650;--line:#d8bfc0}
[data-theme="monochrome"]{--bg:#e7e7e4;--surface:#f7f7f5;--surface2:#dcdcd8;--ink:#252525;--muted:#666;--accent:#444;--accent2:#555;--gold:#666;--line:#c5c5c0}
[data-theme="forest"]{--bg:#e5eadf;--surface:#f3f5ed;--surface2:#d6dfcf;--ink:#263128;--muted:#657065;--accent:#2f5940;--accent2:#704044;--gold:#8c7441;--line:#bdc9ba}
[data-theme="midnight"]{--bg:#171b1b;--surface:#202625;--surface2:#2a302e;--ink:#eee7d9;--muted:#b4ab9e;--accent:#6d9a7e;--accent2:#b16a70;--gold:#b99b61;--line:#3e4742;--shadow:0 10px 30px rgba(0,0,0,.22)}
[data-theme="sepia"]{--bg:#dfd0b6;--surface:#f0e5cf;--surface2:#d7c5a5;--ink:#34281e;--muted:#74634e;--accent:#4d5941;--accent2:#713d3d;--gold:#8c6d38;--line:#bfae8f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.5}
h1,h2,h3,h4,.serif{font-family:Georgia,"Times New Roman",serif;line-height:1.15}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid color-mix(in srgb,var(--focus),transparent 45%);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:250px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;z-index:20}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 22px}
.brand img{width:42px;height:42px;border-radius:10px}
.brand-title{font-family:Georgia,serif;font-size:20px}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:grid;gap:4px}
.nav button{border:0;background:transparent;color:var(--ink);text-align:left;padding:11px 12px;border-radius:10px;display:flex;align-items:center;gap:11px}
.nav button:hover{background:var(--surface2)}
.nav button.active{background:var(--surface2);color:var(--accent);font-weight:700}
.nav-icon{width:22px;text-align:center;font-size:15px}
.sidebar-foot{margin-top:auto;border-top:1px solid var(--line);padding:14px 10px;color:var(--muted);font-size:12px}
.main{margin-left:250px;width:calc(100% - 250px);min-width:0}
.topbar{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg),transparent 8%);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.page-title{margin:0;font-size:25px}
.top-actions{display:flex;gap:8px;align-items:center}
.content{max-width:1400px;margin:0 auto;padding:28px}
.grid{display:grid;gap:18px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card-title{margin:0 0 4px;font-size:18px}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted);font-weight:700}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:650}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.secondary{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.icon{padding:8px 10px}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;gap:14px;align-items:center}
.wrap{flex-wrap:wrap}
.stat{font-size:28px;font-weight:750;font-family:Georgia,serif}
.progress{height:9px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:99px}
.agenda{display:grid;gap:10px}
.agenda-item{border-left:4px solid var(--accent);padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-left-width:4px;border-radius:10px}
.agenda-item.break{border-left-color:var(--gold);opacity:.82}
.agenda-item.done{opacity:.65}
.agenda-item h3{margin:0;font-size:17px}
.agenda-meta{font-size:12px;color:var(--muted);margin:4px 0 8px}
.agenda-desc{font-size:13px;color:var(--muted);margin-bottom:12px}
.pill{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:11px;color:var(--muted)}
.subject-pill{color:var(--accent);font-weight:700}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);background:var(--surface2)}
tr:last-child td{border-bottom:0}
input,select,textarea{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px}
textarea{min-height:100px;resize:vertical}
label{display:grid;gap:6px;font-size:13px;font-weight:650}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.modal-backdrop{position:fixed;inset:0;background:rgba(28,22,17,.48);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.open{display:flex}
.modal{width:min(720px,100%);max-height:92vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.2);padding:22px}
.modal.wide{width:min(1050px,100%)}
.modal h2{margin:0 0 5px}
.modal-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;right:18px;bottom:18px;z-index:200;background:var(--ink);color:var(--surface);padding:11px 15px;border-radius:10px;box-shadow:var(--shadow);display:none;max-width:min(420px,calc(100vw - 36px))}
.toast.show{display:block}
.calendar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-right:0;border-bottom:0}
.cal-day,.cal-head{min-height:90px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px}
.cal-head{min-height:auto;background:var(--surface2);font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:700}
.cal-day.other{opacity:.45}
.cal-day.selected{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-num{font-size:13px;font-weight:700}
.cal-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block;margin-left:4px}
.timer{display:grid;place-items:center;text-align:center;padding:20px}
.ring{width:230px;height:230px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--pct),var(--surface2) 0);position:relative;margin:12px auto 20px}
.ring::after{content:"";position:absolute;inset:12px;background:var(--surface);border-radius:50%}
.ring-inner{position:relative;z-index:1}
.timer-time{font-family:Georgia,serif;font-size:42px;font-weight:700}
.timer-elapsed{font-size:13px;color:var(--muted)}
.choice-row{display:flex;gap:8px;flex-wrap:wrap}
.choice{border:1px solid var(--line);padding:8px 12px;border-radius:9px;background:var(--surface)}
.choice.selected{border-color:var(--accent);background:var(--surface2);color:var(--accent);font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:15px;background:var(--surface2);border-radius:11px}
.kpi .value{font-family:Georgia,serif;font-size:24px;font-weight:700}
.chart{width:100%;height:220px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.list{display:grid;gap:8px}
.list-item{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.notice{padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);font-size:13px}
.hidden{display:none!important}
.mobile-only{display:none}
@media(max-width:1000px){
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:760px){
  .sidebar{position:fixed;top:auto;right:0;bottom:0;left:0;width:auto;height:70px;border-right:0;border-top:1px solid var(--line);padding:6px 5px;display:block}
  .brand,.sidebar-foot{display:none}
  .nav{display:grid;grid-template-columns:repeat(9,1fr);gap:1px;height:100%}
  .nav button{justify-content:center;flex-direction:column;gap:2px;padding:4px 2px;font-size:9px;text-align:center;border-radius:7px}
  .nav-icon{font-size:14px;width:auto}
  .main{margin-left:0;width:100%;padding-bottom:70px}
  .topbar{padding:12px 15px}
  .content{padding:17px 13px}
  .grid-2,.grid-3,.grid-4{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .calendar-grid{font-size:11px}
  .cal-day{min-height:62px;padding:5px}
  .cal-head{padding:6px 3px}
  .top-actions .hide-mobile{display:none}
  .page-title{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" aria-label="Main navigation">
    <div class="brand">
      <img src="icons/icon-192.png" alt="">
      <div><div class="brand-title">Academic Ledger</div><div class="brand-sub">A-Level command centre</div></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">Local-first study journal<br><span id="storageStatus">Preparing storage…</span></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <h1 class="page-title" id="pageTitle">Home</h1>
      <div class="top-actions">
        <button class="btn primary" data-action="quick-add">+ Add session</button>
        <button class="btn hide-mobile" data-action="go-settings">Settings</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop" role="presentation">
  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input id="importInput" type="file" accept="application/json,.json" class="hidden">

<script>
"use strict";

/* ============================================================
   EDITABLE APP DATA
   Default topics are intentionally empty. Create topics in the
   application; deleting one never deletes historical sessions.
   ============================================================ */
const SUBJECTS = [
  {id:"mathematics",name:"Mathematics"},
  {id:"furtherMathematics",name:"Further Mathematics"},
  {id:"economics",name:"Economics"},
  {id:"computerScience",name:"Computer Science"}
];

const DEFAULT_TOPICS = {
  mathematics: [],
  furtherMathematics: [],
  economics: [],
  computerScience: []
};

const THEMES = {
  autumn:"Academia Autumn", christmas:"Christmas", minimal:"Plain / Minimal",
  pink:"Soft Pink", monochrome:"Monochrome", forest:"Forest",
  midnight:"Midnight Academia", sepia:"Library / Sepia"
};

const D = (subject,duration,description,type="study") => ({id:uid(),subject,duration,description,type});
const DEFAULT_TIMETABLE = {
  A:{
    Monday:[
      D("mathematics",120,"Review today's Mathematics lesson → identify anything not fully understood → targeted textbook/problem-set questions → finish with timed exam questions."),
      D("furtherMathematics",120,"Review recent Further Maths material → attempt difficult problems without notes → check worked solutions → mark and record mistakes."),
      D("break",60,"Dinner","break"),
      D("economics",90,"Review recent class material using active recall → reproduce key diagrams/chains of analysis from memory → complete one substantial exam question → mark and improve the answer.")
    ],
    Tuesday:[
      D("computerScience",120,"Review today's/recent theory → active-recall questions without notes → apply concepts to unfamiliar questions → finish with exam questions and correct misconceptions."),
      D("mathematics",120,"Pure/problem-solving practice → focus on multi-step questions → timed exam section → mark and record recurring errors."),
      D("break",60,"Dinner","break"),
      D("economics",90,"Active recall of recent material → practise explaining chains of reasoning → one timed extended-response question → mark and rewrite weak sections.")
    ],
    Wednesday:[
      D("furtherMathematics",120,"Consolidate the most recent Further Maths work → challenging problem set → attempt selected problems with no notes → analyse mistakes."),
      D("computerScience",90,"Theory consolidation → active recall → programming/problem-solving practice → exam questions focused on applying knowledge."),
      D("break",60,"Dinner","break"),
      D("mathematics",120,"Spaced retrieval of material from earlier in the week → mixed problem set → timed questions → mark carefully and update your error log.")
    ],
    Thursday:[
      D("economics",120,"Consolidate recent classroom material → active recall of concepts and relationships → practise diagrams/chains of analysis → one timed essay-style question → mark and improve."),
      D("furtherMathematics",120,"High-difficulty problem-solving session → work independently before checking methods → second attempts at difficult questions → record mistakes and gaps."),
      D("break",60,"Dinner","break"),
      D("computerScience",90,"Review current theory → retrieval practice → programming/problem-solving task → exam questions and marking.")
    ],
    Friday:[
      D("mathematics",120,"Weekly Mathematics consolidation → mixed questions from material studied across the week → timed exam practice → identify the three most important weaknesses to revisit."),
      D("economics",90,"Weekly retrieval session → reconstruct important concepts/diagrams from memory → one timed exam response → mark against the mark scheme."),
      D("break",60,"Dinner","break"),
      D("computerScience",120,"Consolidate the week's Computer Science learning → active-recall test → programming/problem-solving practice → exam questions → update your mistakes log.")
    ],
    Saturday:[
      D("furtherMathematics",150,"Deep problem-solving session → challenging questions across currently studied material → work without notes → mark thoroughly → redo questions you initially failed."),
      D("mathematics",120,"Mixed-topic problem solving → prioritise multi-step questions → timed exam section → detailed marking."),
      D("break",60,"Dinner","break"),
      D("economics",90,"Active recall → diagrams/chains of analysis → one timed extended-response question → mark → improve the answer using the mark scheme."),
      D("computerScience",120,"Theory retrieval → programming/problem-solving practice → unfamiliar application questions → exam questions → correct and log mistakes.")
    ],
    Sunday:[
      D("economics",120,"Spaced retrieval of the week's Economics material → test yourself before looking at notes → practise application and chains of reasoning → one timed exam response → mark and improve."),
      D("furtherMathematics",150,"Challenging problem set focused on weakest current areas → independent attempts → review solutions → redo failed questions from scratch."),
      D("break",60,"Dinner","break"),
      D("computerScience",90,"Weekly retrieval test → consolidate theory you struggled with → programming/problem-solving practice → exam questions."),
      D("mathematics",120,"Weekly mixed Mathematics session → timed questions → analyse mistakes → revisit difficult questions without looking at previous solutions.")
    ]
  },
  B:{
    Monday:[
      D("mathematics",120,"Review today's Mathematics content → targeted questions → increasingly difficult problems → finish with timed exam questions."),
      D("furtherMathematics",120,"Consolidate today's/recent material → difficult independent problems → check solutions after attempting them → record errors and unresolved points."),
      D("break",60,"Dinner","break"),
      D("economics",90,"Review recent Economics material → active recall → reproduce diagrams and chains of reasoning → complete and mark an exam question.")
    ],
    Tuesday:[
      D("furtherMathematics",120,"Reinforce today's/recent learning → challenging problem set → focus on mathematical reasoning → mark and redo errors."),
      D("computerScience",120,"Review recent theory → active recall → programming/problem-solving practice → unfamiliar exam questions → mark and correct."),
      D("break",60,"Dinner","break"),
      D("mathematics",90,"Spaced retrieval of recent Mathematics → targeted problem set → timed questions → record weaknesses for the weekend.")
    ],
    Wednesday:[
      D("economics",120,"Consolidate recent Economics learning → active recall → practise application and analytical chains → timed extended-response question → mark and improve."),
      D("mathematics",120,"Mixed problem solving → deliberately combine older and newer material → timed questions → detailed error analysis."),
      D("break",60,"Dinner","break"),
      D("computerScience",90,"Theory retrieval → apply concepts to questions → programming/problem solving → exam questions and corrections.")
    ],
    Thursday:[
      D("furtherMathematics",120,"Deep problem-solving session → difficult current-topic questions → independent attempts → solution analysis → redo failed problems."),
      D("computerScience",90,"Consolidate current theory → active recall → programming/problem-solving practice → exam questions."),
      D("break",60,"Dinner","break"),
      D("economics",90,"Active recall → diagrams and chains of analysis → timed exam question → mark and improve the weakest sections.")
    ],
    Friday:[
      D("mathematics",120,"Weekly Mathematics consolidation → mixed questions → timed exam section → mark and identify recurring mistakes."),
      D("economics",90,"Weekly retrieval → test knowledge without notes → application practice → one timed written response → mark."),
      D("break",60,"Dinner","break"),
      D("furtherMathematics",120,"Challenging weekly problem set → prioritise weaknesses identified during the week → work independently → mark → redo difficult questions.")
    ],
    Saturday:[
      D("computerScience",150,"Deep theory consolidation → active recall → programming/problem-solving practice → unfamiliar application questions → exam practice."),
      D("furtherMathematics",150,"High-difficulty problem-solving → focus on weakest current material → independent attempts → mark → redo errors."),
      D("mathematics",90,"Timed mixed-question session → mark thoroughly → analyse errors → targeted second attempts."),
      D("break",60,"Dinner","break"),
      D("economics",90,"Active recall → diagrams/chains of analysis → timed exam response → mark and improve.")
    ],
    Sunday:[
      D("economics",120,"Comprehensive weekly retrieval → consolidate weak areas → application and analytical practice → timed extended-response question → mark and improve."),
      D("furtherMathematics",120,"Spaced retrieval + challenging problems → revisit errors from the week → attempt previously difficult questions again without notes."),
      D("mathematics",120,"Mixed-topic problem solving → timed exam questions → detailed marking → maintain and review your error log."),
      D("break",60,"Dinner","break"),
      D("computerScience",120,"Weekly theory retrieval → programming/problem-solving practice → unfamiliar exam questions → mark → consolidate remaining gaps.")
    ]
  }
};

const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const NAV=[
  ["home","⌂","Home"],["timetable","▦","Timetable"],["calendar","□","Calendar"],["history","≡","History"],
  ["progress","◒","Progress"],["subjects","◇","Subjects"],["weekend","✓","Weekend"],["pressing","!","Pressing"],["settings","⚙","Settings"]
];

let state = {
  settings:{week:"A",theme:"autumn",onboarded:false,notifications:false,reminder:"daily",clock24:true,firstDay:1,defaultSession:"prepare"},
  timetable:null,topics:[],sessions:[],weekendTasks:[],pressing:[],weeklyReviews:[],activeTimer:null
};
let db=null, storageMode="indexedDB", currentPage="home", selectedDate=isoDate(new Date()), calendarCursor=new Date();
let timerInterval=null, modalCleanup=null;

function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(16).slice(2));}
function isoDate(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);}
function fmtDate(s,opts={weekday:"long",day:"numeric",month:"long"}){return new Intl.DateTimeFormat(undefined,opts).format(new Date(s+"T12:00:00"));}
function minutesText(m){m=Math.max(0,Math.round(m||0));const h=Math.floor(m/60),r=m%60;return h?`${h}h ${r?`${r}m`:""}`.trim():`${r}m`;}
function dateKey(d){return isoDate(d);}
function subjectName(id){return SUBJECTS.find(s=>s.id===id)?.name||id||"Unknown";}
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function clone(x){return JSON.parse(JSON.stringify(x));}
function showToast(msg){const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(showToast.t);showToast.t=setTimeout(()=>el.classList.remove("show"),2800);}
function safeLSGet(k){try{return localStorage.getItem(k)}catch{return null}}
function safeLSSet(k,v){try{localStorage.setItem(k,v);return true}catch{return false}}

async function initDB(){
  try{
    if(!("indexedDB" in window)) throw new Error("IndexedDB unavailable");
    db=await new Promise((resolve,reject)=>{
      const req=indexedDB.open("academic-ledger",1);
      req.onupgradeneeded=()=>{const d=req.result;["settings","timetable","topics","sessions","weekendTasks","pressing","weeklyReviews","activeTimer"].forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:"id"});});};
      req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);
    });
    storageMode="indexedDB";
    return true;
  }catch(e){storageMode="localStorage";return false}
}
async function dbAll(store){
  if(storageMode==="indexedDB") return new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});

}

function openTimetableEntry(week,day,index=null){
  const old=index!==null?state.timetable[week][day][index]:null;
  openModal(`<div class="modal-head"><div><div class="eyebrow">Timetable editor</div><h2 id="modalTitle">${old?"Edit entry":"Add entry"}</h2></div><button class="btn" data-close>Close</button></div><div class="form-grid"><label>Day<select id="teDay">${DAYS.map(d=>`<option ${d===day?"selected":""}>${d}</option>`).join("")}</select></label><label>Session type<select id="teType"><option value="study" ${old?.type!=="break"?"selected":""}>Study</option><option value="break" ${old?.type==="break"?"selected":""}>Dinner / Break</option></select></label><label>Subject<select id="teSub">${SUBJECTS.map(s=>`<option value="${s.id}" ${old?.subject===s.id?"selected":""}>${s.name}</option>`).join("")}</select></label><label>Duration (minutes)<input id="teDur" type="number" min="5" max="720" value="${old?.duration||60}"></label><label class="full">Description<textarea id="teDesc">${escapeHtml(old?.description||"")}</textarea></label></div><div class="modal-actions"><button class="btn primary" id="teSave">Save entry</button></div>`,
  m=>{const toggle=()=>{const study=m.querySelector("#teType").value==="study";m.querySelector("#teSub").disabled=!study;if(!study)m.querySelector("#teDesc").value=m.querySelector("#teDesc").value||"Dinner / Break"};m.querySelector("#teType").onchange=toggle;toggle();m.querySelector("#teSave").onclick=async()=>{const type=m.querySelector("#teType").value,dur=Number(m.querySelector("#teDur").value),nd=m.querySelector("#teDay").value;if(!dur||dur<5){showToast("Duration must be at least 5 minutes.");return}const entry={id:old?.id||uid(),subject:type==="study"?m.querySelector("#teSub").value:"break",duration:dur,description:m.querySelector("#teDesc").value.trim()||"Study session",type};if(index!==null){state.timetable[week][day].splice(index,1);state.timetable[week][nd].push(entry)}else state.timetable[week][nd].push(entry);await dbPut("timetable",{id:"main",data:state.timetable});closeModal();renderTimetable()}})
}
function bindActions(){
  document.querySelectorAll("[data-action]").forEach(b=>{b.onclick=async()=>{const a=b.dataset.action;try{
    if(a==="retry-page"){renderPage();return}
    else if(a==="safe-reset-timetable"){state.timetable=clone(DEFAULT_TIMETABLE);await dbPut("timetable",{id:"main",data:state.timetable});showToast("Timetable repaired.");renderPage();return}
    else if(a==="quick-add")quickAdd();
    else if(a==="go-settings")navigate("settings");
    else if(a==="start"){const item=state.timetable[b.dataset.week][b.dataset.day].find(x=>x.id===b.dataset.item);openPrepare(item,b.dataset.day,b.dataset.week)}
    else if(a==="complete-planned"){const item=state.timetable[b.dataset.week][b.dataset.day].find(x=>x.id===b.dataset.item);await markPlanned(item,b.dataset.day,b.dataset.week)}
    else if(a==="mark-planned"){const item=state.timetable[b.dataset.week][b.dataset.day].find(x=>x.id===b.dataset.item);await markPlanned(item,b.dataset.day,b.dataset.week,b.dataset.status)}
    else if(a==="view-session")viewSession(b.dataset.session);
    else if(a==="open-timer")openTimerModal();
    else if(a==="toggle-pause")await togglePause();
    else if(a==="finish-timer")await finishTimer();
    else if(a==="set-week"){state.settings.week=b.dataset.week;await persistSettings();renderPage()}
    else if(a==="reset-week"){if(confirm(`Reset Week ${b.dataset.week} to the supplied defaults?`)){state.timetable[b.dataset.week]=clone(DEFAULT_TIMETABLE[b.dataset.week]);await dbPut("timetable",{id:"main",data:state.timetable});renderTimetable()}}
    else if(a==="reset-day"){if(confirm(`Reset ${b.dataset.day} in Week ${b.dataset.week} to its supplied default?`)){state.timetable[b.dataset.week][b.dataset.day]=clone(DEFAULT_TIMETABLE[b.dataset.week][b.dataset.day]);await dbPut("timetable",{id:"main",data:state.timetable});renderTimetable()}}
    else if(a==="reset-timetable"){if(confirm("Reset the entire timetable to the supplied Week A and Week B defaults?")){state.timetable=clone(DEFAULT_TIMETABLE);await dbPut("timetable",{id:"main",data:state.timetable});renderPage();showToast("Timetable reset.")}}
    else if(a==="add-entry")openTimetableEntry(b.dataset.week,b.dataset.day);
    else if(a==="edit-entry")openTimetableEntry(b.dataset.week,b.dataset.day,Number(b.dataset.index));
    else if(a==="delete-entry"){if(confirm("Delete this timetable entry?")){state.timetable[b.dataset.week][b.dataset.day].splice(Number(b.dataset.index),1);await dbPut("timetable",{id:"main",data:state.timetable});renderTimetable()}}
    else if(a==="open-timetable")navigate("timetable");
    else if(a==="cal-prev"){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()-1,1);renderCalendar()}
    else if(a==="cal-next"){calendarCursor=new Date(calendarCursor.getFullYear(),calendarCursor.getMonth()+1,1);renderCalendar()}
    else if(a==="cal-today"){calendarCursor=new Date();selectedDate=isoDate(new Date());renderCalendar()}
    else if(a==="select-date"){selectedDate=b.dataset.date;calendarCursor=new Date(selectedDate+"T12:00:00");renderCalendar()}
    else if(a==="topics")openTopics();
    else if(a==="weekly-review")openWeeklyReview();
    else if(a==="generate-weekend"){await generateWeekendTasks();showToast("Weekend agenda refreshed.");renderWeekend()}
    else if(a==="escalate"){await escalatePressing();showToast("Pressing Matters checked.");renderPressing()}
    else if(a==="edit-weekend")editWeekend(b.dataset.id);
    else if(a==="delete-weekend"){if(confirm("Delete this weekend task?")){await dbDelete("weekendTasks",b.dataset.id);state.weekendTasks=state.weekendTasks.filter(x=>x.id!==b.dataset.id);renderWeekend()}}
    else if(a==="snooze")snoozePressing(b.dataset.id);
    else if(a==="request-notifications")requestNotifications();
    else if(a==="export")exportData();
    else if(a==="import")document.getElementById("importInput").click();
    else if(a==="clear-data")await clearData();
  }catch(e){console.error("Button action failed:",a,e);showToast(`Could not complete "${a}".`)}}});
  document.querySelectorAll("[data-task-check]").forEach(x=>x.onchange=async()=>{const t=state.weekendTasks.find(t=>t.id===x.dataset.taskCheck);t.completed=x.checked;t.completedAt=x.checked?new Date().toISOString():null;await dbPut("weekendTasks",t);renderWeekend()});
  document.querySelectorAll("[data-press-check]").forEach(x=>x.onchange=async()=>{const t=state.pressing.find(t=>t.id===x.dataset.pressCheck);t.completed=x.checked;t.completedAt=x.checked?new Date().toISOString():null;await dbPut("pressing",t);renderPressing()});
}
function viewSession(id){
  const s=state.sessions.find(x=>x.id===id);if(!s){showToast("Session record not found.");return}
  openModal(`<div class="modal-head"><div><div class="eyebrow">${fmtDate(s.date,{day:"numeric",month:"long",year:"numeric"})}</div><h2 id="modalTitle">${escapeHtml(subjectName(s.subject))}</h2><div class="muted">${minutesText(s.durationActual||0)} actual · ${escapeHtml(s.status)}</div></div><button class="btn" data-close>Close</button></div>
  <div class="list"><div class="list-item"><strong>Topic</strong><div>${escapeHtml(s.topic||"None")}</div></div><div class="list-item"><strong>Objective</strong><div>${escapeHtml(s.objective||"None")}</div></div><div class="list-item"><strong>Specific tasks</strong><div>${escapeHtml(s.specificTasks||"None")}</div></div><div class="list-item"><strong>Target outcome</strong><div>${escapeHtml(s.targetOutcome||"None")}</div></div><div class="list-item"><strong>What I covered</strong><div>${escapeHtml(s.actualWork||"None")}</div></div><div class="list-item"><strong>What went well</strong><div>${escapeHtml(s.wentWell||"None")}</div></div><div class="list-item"><strong>Improvement</strong><div>${escapeHtml(s.improvement||"None")}</div></div><div class="list-item"><strong>Difficulty</strong><div>${s.difficulty?`${s.difficulty} / 5`:"Not recorded"} · Objective: ${escapeHtml(s.objectiveStatus||"")}</div></div></div>`);
}
function openWeeklyReview(){
  const end=weekDates(isoDate(new Date())).slice(-1)[0], existing=state.weeklyReviews.find(r=>r.weekStart===weekDates(isoDate(new Date()))[0]);
  const dates=weekDates(isoDate(new Date())), completed=state.sessions.filter(s=>dates.includes(s.date)&&s.status==="completed"), planned=weekPlanned(isoDate(new Date())), actual=completed.reduce((a,s)=>a+s.durationActual,0);
  const bySubject=SUBJECTS.map(s=>({name:s.name,count:completed.filter(x=>x.subject===s.id).length}));
  const strongest=bySubject.slice().sort((a,b)=>b.count-a.count)[0];
  const missed=state.sessions.filter(s=>dates.includes(s.date)&&["incomplete","skipped"].includes(s.status)).length;
  const rescheduled=state.sessions.filter(s=>dates.includes(s.date)&&s.status==="rescheduled").length;
  const improvements=completed.filter(s=>s.improvement).length;
  const improvementIds=new Set(completed.filter(s=>s.improvement).map(s=>s.id));
  const improvementsDone=state.weekendTasks.filter(t=>improvementIds.has(t.sourceSession)&&t.completed).length;
  openModal(`<div class="modal-head"><div><div class="eyebrow">Week ending ${fmtDate(end,{day:"numeric",month:"long"})}</div><h2 id="modalTitle">Weekly review</h2></div><button class="btn" data-close>Close</button></div>
  <div class="kpi-grid"><div class="kpi"><div class="eyebrow">Planned hours</div><div class="value">${minutesText(planned)}</div></div><div class="kpi"><div class="eyebrow">Completed</div><div class="value">${minutesText(actual)}</div></div><div class="kpi"><div class="eyebrow">Completion</div><div class="value">${pct(actual,planned)}%</div></div><div class="kpi"><div class="eyebrow">Strongest subject</div><div class="value" style="font-size:17px">${escapeHtml(strongest?.name||"—")}</div></div></div>
  <div class="list" style="margin-top:14px"><div class="list-item"><strong>Subject breakdown</strong><div class="small muted">${bySubject.map(x=>`${escapeHtml(x.name)}: ${x.count} sessions`).join(" · ")}</div></div><div class="list-item"><strong>Improvements</strong><div class="small muted">${improvements} created · ${improvementsDone} completed · ${state.weekendTasks.filter(t=>dates.includes(t.originalDate)&&!t.completed).length} outstanding</div></div><div class="list-item"><strong>Session status</strong><div class="small muted">${completed.length} completed · ${missed} missed/skipped · ${rescheduled} rescheduled</div></div></div>
  <div class="form-grid" style="margin-top:14px"><label class="full">What was your biggest win this week?<textarea id="wrWin">${escapeHtml(existing?.win||"")}</textarea></label><label class="full">What do you want to improve next week?<textarea id="wrImprove">${escapeHtml(existing?.nextImprovement||"")}</textarea></label></div>
  <div class="modal-actions"><button class="btn primary" id="wrSave">Save weekly review</button></div>`,
  m=>m.querySelector("#wrSave").onclick=async()=>{const r=existing||{id:uid(),weekStart:dates[0],weekEnd:end,createdAt:new Date().toISOString()};r.win=m.querySelector("#wrWin").value.trim();r.nextImprovement=m.querySelector("#wrImprove").value.trim();r.plannedMinutes=planned;r.completedMinutes=actual;r.completionRate=pct(actual,planned);r.completedSessions=completed.length;r.missedSessions=missed;r.rescheduledSessions=rescheduled;r.strongestSubject=strongest?.name||"";r.improvementsCreated=improvements;r.improvementsCompleted=improvementsDone;await dbPut("weeklyReviews",r);if(!existing)state.weeklyReviews.push(r);else Object.assign(existing,r);closeModal();showToast("Weekly review saved.");renderHome();});
}
async function generateWeekendTasks(){
  const weekday=new Set(["Monday","Tuesday","Wednesday","Thursday","Friday"]);const source=state.sessions.filter(s=>s.status==="completed"&&weekday.has(s.day)&&s.improvement?.trim());
  for(const s of source){const existing=state.weekendTasks.find(t=>t.sourceSession===s.id&&!t.escalated&&!t.completed);if(existing)continue;const t={id:uid(),task:s.improvement.trim(),subject:s.subject,sourceSession:s.id,originalDate:s.date,originalImprovement:s.improvement.trim(),assignedDay:"Saturday",completed:false,notes:"",deadline:weekDates(s.date).slice(-1)[0],createdAt:new Date().toISOString(),escalated:false};await dbPut("weekendTasks",t);state.weekendTasks.push(t)}
}
function editWeekend(id){
 const t=state.weekendTasks.find(x=>x.id===id);if(!t)return;
 openModal(`<div class="modal-head"><div><div class="eyebrow">Weekend task</div><h2 id="modalTitle">Edit task</h2></div><button class="btn" data-close>Close</button></div><div class="form-grid"><label class="full">Task<textarea id="ewTask">${escapeHtml(t.task)}</textarea></label><label>Assigned day<select id="ewDay">${["Saturday","Sunday","Both"].map(x=>`<option ${t.assignedDay===x?"selected":""}>${x}</option>`).join("")}</select></label><label>Deadline<input id="ewDeadline" type="date" value="${t.deadline||""}"></label><label class="full">Notes<textarea id="ewNotes">${escapeHtml(t.notes||"")}</textarea></label></div><div class="modal-actions"><button class="btn primary" id="ewSave">Save</button></div>`,m=>m.querySelector("#ewSave").onclick=async()=>{t.task=m.querySelector("#ewTask").value.trim();t.assignedDay=m.querySelector("#ewDay").value;t.deadline=m.querySelector("#ewDeadline").value;t.notes=m.querySelector("#ewNotes").value.trim();await dbPut("weekendTasks",t);closeModal();renderWeekend()});
}
async function escalatePressing(){
  const now=new Date(), day=now.getDay();if(day!==0 && day!==1)return;
  const incomplete=state.weekendTasks.filter(t=>!t.completed&&!t.escalated&&t.deadline&&new Date(t.deadline+"T23:59:59")<now);
  for(const t of incomplete){t.escalated=true;await dbPut("weekendTasks",t);const p={id:uid(),task:t.task,subject:t.subject,sourceTask:t.id,originalDate:t.originalDate,daysOutstanding:daysOutstanding(t),priority:"Normal",notes:t.notes||"",completed:false,snoozedUntil:null,createdAt:new Date().toISOString()};await dbPut("pressing",p);state.pressing.push(p)}
}
function snoozePressing(id){const t=state.pressing.find(x=>x.id===id);if(!t)return;const d=new Date();d.setDate(d.getDate()+1);t.snoozedUntil=isoDate(d);dbPut("pressing",t);showToast("Snoozed until tomorrow.");renderPressing()}
async function requestNotifications(){if(!("Notification" in window)){showToast("Browser notifications are not available here.");return}try{const p=await Notification.requestPermission();showToast(`Notification permission: ${p}`);state.settings.notifications=p==="granted";await persistSettings();renderSettings()}catch{showToast("Notification permission could not be requested.")}}
function exportData(){
 const payload={schemaVersion:1,exportedAt:new Date().toISOString(),settings:state.settings,timetable:state.timetable,topics:state.topics,sessions:state.sessions,weekendTasks:state.weekendTasks,pressing:state.pressing,weeklyReviews:state.weeklyReviews};
 const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`academic-ledger-backup-${isoDate(new Date())}.json`;a.click();URL.revokeObjectURL(url);showToast("Backup exported.");
}
function validImport(x){return x&&x.schemaVersion===1&&x.settings&&x.timetable&&x.topics&&x.sessions&&x.weekendTasks&&x.pressing&&x.weeklyReviews&&["A","B"].every(w=>x.timetable[w]&&DAYS.every(d=>Array.isArray(x.timetable[w][d])))}
document.getElementById("importInput").onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const x=JSON.parse(await file.text());if(!validImport(x))throw new Error("Invalid schema");if(!confirm("Importing will replace your current application data. Continue?"))return;await dbClear();state.settings={...state.settings,...x.settings};state.timetable=x.timetable;state.topics=x.topics;state.sessions=x.sessions;state.weekendTasks=x.weekendTasks;state.pressing=x.pressing;state.weeklyReviews=x.weeklyReviews;await persistSettings();await dbPut("timetable",{id:"main",data:state.timetable});for(const k of ["topics","sessions","weekendTasks","pressing","weeklyReviews"])for(const v of state[k])await dbPut(k,v);applyTheme();showToast("Backup imported.");renderPage()}catch(err){console.error(err);showToast("That backup could not be imported. Your existing data was kept.")}e.target.value=""};
async function clearData(){if(!confirm("Clear all study data, topics, timetable edits and settings? This cannot be undone unless you have an export backup."))return;await dbClear();state={settings:{week:"A",theme:"autumn",onboarded:true,notifications:false,reminder:"daily",clock24:true,firstDay:1,defaultSession:"prepare"},timetable:clone(DEFAULT_TIMETABLE),topics:[],sessions:[],weekendTasks:[],pressing:[],weeklyReviews:[],activeTimer:null};await persistSettings();await dbPut("timetable",{id:"main",data:state.timetable});applyTheme();showToast("All local data cleared.");renderPage()}
function onboarding(){
 openModal(`<div class="modal-head"><div><div class="eyebrow">First use</div><h2 id="modalTitle">Set up your academic ledger</h2></div></div><div class="grid"><label>1. Which week are you starting with?<div class="choice-row" id="obWeek"><button class="choice selected" data-v="A">Week A</button><button class="choice" data-v="B">Week B</button></div></label><label>2. Notifications?<select id="obNotify"><option value="false">No</option><option value="true">Yes</option></select></label><label>3. Theme?<select id="obTheme">${Object.entries(THEMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></label><label>4. Review/edit timetable?<select id="obEdit"><option value="false">Go directly to Home</option><option value="true">Open timetable editor after setup</option></select></label></div><div class="modal-actions"><button class="btn primary" id="obSave">Enter Home</button></div>`,m=>{let w="A";m.querySelectorAll("#obWeek .choice").forEach(b=>b.onclick=()=>{w=b.dataset.v;m.querySelectorAll("#obWeek .choice").forEach(x=>x.classList.toggle("selected",x===b))});m.querySelector("#obSave").onclick=async()=>{state.settings.week=w;state.settings.theme=m.querySelector("#obTheme").value;state.settings.onboarded=true;state.settings.notifications=m.querySelector("#obNotify").value==="true";await persistSettings();safeLSSet("ledger-onboarded","1");applyTheme();const edit=m.querySelector("#obEdit").value==="true";closeModal();navigate(edit?"timetable":"home");}});
}
async function recoverTimer(){
 if(state.activeTimer?.status==="awaiting-reflection"){openReflection(state.activeTimer,false);return}
 if(state.activeTimer?.status==="running"||state.activeTimer?.status==="paused")showToast("An active session was recovered."); 
}
function registerSW(){if("serviceWorker" in navigator && location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW registration failed",e));}}
function boot(){
  // Progressive initialisation: visible shell -> data -> theme -> timetable -> interactions -> SW.
  renderNav();renderHome();
  initDB().then(async()=>{try{await seedTimetable();await loadState();document.getElementById("storageStatus").textContent=`Storage: ${storageMode}`;renderNav();renderPage();await recoverTimer();if(!state.settings.onboarded)onboarding();}catch(e){console.error(e);showToast("Saved data could not be loaded; the app is using safe defaults.")}finally{registerSW()}}).catch(e=>{console.error(e);showToast("Storage initialisation failed; local fallback is active.");registerSW()});
}
window.addEventListener("beforeunload",()=>{if(state.activeTimer)dbPut("activeTimer",state.activeTimer).catch(()=>{})});
boot();
</script>
</body>
